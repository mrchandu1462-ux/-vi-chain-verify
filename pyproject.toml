[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-chain-verify"
version = "0.1.0"
description = "Independent DV-style adversarial verifier for Mastercard/XRPL Verifiable Intent (L1->L2->L3) credential chains"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
vi-verify = "vi_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
